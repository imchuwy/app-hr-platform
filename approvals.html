      <h1>Personal approvals status</h1>
      <p class="muted">Oscar's requests - past and present.</p>
    </div>
    <div class="table-wrap">
      <table class="people-table approvals-table" aria-label="My requests">

          <tr>
            <th>Request</th>
            <th>Submitted</th>

          </tr>
        </thead>

      </table>
    </div>
  </section>

  <section class="panel approvals-panel">
    <div class="panel-header">

    </div>
    <div class="table-wrap">
      <table class="people-table approvals-table" aria-label="Team requests">
        <thead>
          <tr>
            <th>Employee</th>
            <th>Request</th>
            <th>Submitted</th>
            <th>Status</th>
