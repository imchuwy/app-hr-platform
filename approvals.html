    <script src="styles/oc-ai-theme.js"></script>
    <link rel="stylesheet" href="styles/oc-ai.css" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="scripts/oc-ai-controls.js"></script>
  </head>
  <body class="oc-app">
    <a class="oc-skip oc-button" href="#main">Skip to content</a>
    <header class="oc-header">
      <div class="frame mast">
        <a class="oc-brand oc-brand-shore" href="index.html" aria-label="HR Platform home">
          <picture class="oc-brand-light">
            <source media="(max-width: 680px)" srcset="assets/icons/shore-wash-icon-light.png" width="512" height="512" />
            <img src="assets/logos/shore-wash-banner.png" width="692" height="245" alt="" />
          </picture>
          <img class="oc-brand-dark" src="assets/icons/shore-wash-icon-dark.png" width="512" height="512" alt="" />
        </a>
        <nav aria-label="Main">          <a href="index.html">Overview</a>
          <a href="office.html">Offices</a>
          <a href="people.html">People</a>
          <a href="approvals.html" aria-current="page">Approvals</a>
          <a href="settings.html">Settings</a>
        </nav>
      </div>
    </header>
    <main class="frame" id="main" tabindex="-1">
      <div class="page-heading"><p class="eyebrow">HR Platform</p><h1>Approvals</h1></div>
<section class="panel approvals-panel">
    <div class="panel-header">
      <h2>My requests</h2>
      <p class="muted">Sample request history for Alex Morgan.</p>
    </div>
    <div class="table-wrap">
      <table class="people-table approvals-table" aria-label="My requests">
        <thead>
          <tr>
            <th>Request</th>
            <th>Submitted</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="myRequests"></tbody>
      </table>
    </div>
  </section>

  <section class="panel approvals-panel">
    <div class="panel-header">
      <h2>Team requests</h2>
      <p class="muted">Requests awaiting review.</p>
    </div>
    <div class="table-wrap">
      <table class="people-table approvals-table" aria-label="Team requests">
        <thead>
          <tr>
            <th>Employee</th>
            <th>Request</th>
            <th>Submitted</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="teamRequests"></tbody>
      </table>
    </div>
  </section>
    </main>

    <script src="approvals.js"></script>
  </body>
