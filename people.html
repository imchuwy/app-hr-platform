<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>People directory | HR Platform</title>
    <link rel="icon" type="image/png" href="assets/icons/shore-wash-icon-light.png" data-dark-href="assets/icons/shore-wash-icon-dark.png" />
    <script src="styles/oc-ai-theme.js"></script>
    <link rel="stylesheet" href="styles/oc-ai.css" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="scripts/oc-ai-controls.js"></script>
  </head>
  <body class="oc-app">
    <a class="oc-skip oc-button" href="#main">Skip to content</a>
    <header class="oc-header">
      <div class="frame mast">
        <a class="app-brand" href="index.html" aria-label="HR Platform home">
          <svg width="0" height="0" aria-hidden="true" focusable="false">
            <filter id="shore-wash-night" color-interpolation-filters="sRGB">
              <feColorMatrix type="matrix" values="-0.22 0 0 0 1.04
                                                   -1.03 0 0 0 1.21
                                                   -1.12 0 0 0 1.20
                                                    0    0 0 1 0" />
            </filter>
          </svg>
          <img src="assets/logos/shore-wash-banner.png" width="692" height="245" alt="" />
          <span>HR Platform</span>
        </a>
        <nav aria-label="Main">          <a href="index.html">Overview</a>
          <a href="office.html">Offices</a>
          <a href="people.html" aria-current="page">People</a>
          <a href="approvals.html">Approvals</a>
          <a href="settings.html">Settings</a>
        </nav>
      </div>
    </header>
    <main class="frame" id="main" tabindex="-1">
      <div class="page-heading"><p class="eyebrow">HR Platform</p><h1>People directory</h1></div>
      <section class="panel directory" aria-label="People by name, role and office">
        <div class="table-wrap">
            <table class="people-table" aria-label="Employee directory">
              <thead>
                <tr>
                  <th aria-sort="ascending">
                    <button class="sort-button" type="button" data-sort-key="name" data-direction="asc">
                      Name
                      <span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                  <th aria-sort="none">
                    <button class="sort-button" type="button" data-sort-key="title">
                      Job title
                      <span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                  <th aria-sort="none">
                    <button class="sort-button" type="button" data-sort-key="location">
                      Location
                      <span class="sort-indicator" aria-hidden="true"></span>
                    </button>
                  </th>
                </tr>
              </thead>
              <tbody id="peopleTableBody"></tbody>
            </table>
        </div>
      </section>
    </main>

    <script src="people.js"></script>
  </body>
</html>
